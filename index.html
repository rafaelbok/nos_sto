<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191b20">
  <meta name="description" content="Nostalgic Store — novidades em breve.">
  <title>Nostalgic Store | Em breve</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:dark;--bg:#191b20;--fg:#f6edda;--muted:#bcb3a6;--accent:#e2a76f}
    *{box-sizing:border-box}html{min-height:100%}body{margin:0;min-height:100svh;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(226,167,111,.09),transparent 46%),repeating-linear-gradient(0deg,transparent 0 5px,rgba(255,255,255,.012) 6px 7px)}
    .shell{width:min(1120px,100%);margin:0 auto;padding:34px clamp(20px,6vw,65px);display:flex;flex:1;flex-direction:column;position:relative}
    header{display:flex;align-items:center;gap:13px}.mark{width:43px;height:43px;border:1px solid var(--accent);display:grid;place-items:center;font:700 19px Georgia,serif;color:var(--accent);border-radius:50%}.brand{font-size:13px;letter-spacing:.19em;font-weight:800;text-transform:uppercase}
    main{flex:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:75px 0 95px}.eyebrow{text-transform:uppercase;letter-spacing:.23em;font-size:11px;font-weight:700;color:var(--accent);margin:0 0 25px}.headline{font-family:Georgia,'Times New Roman',serif;font-size:clamp(58px,11vw,126px);font-weight:400;line-height:.96;letter-spacing:-.065em;margin:0}.headline em{color:var(--accent);font-weight:400}.desc{max-width:500px;line-height:1.7;font-size:clamp(15px,2vw,18px);color:var(--muted);margin:31px 0 0}.line{margin-top:38px;width:64px;height:3px;background:var(--accent)}
    footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;border-top:1px solid #47413b;padding-top:20px;color:#a99e8f;font-size:12px}
    @media(max-width:540px){.shell{padding:24px 22px}.brand{font-size:11px}main{padding:85px 0}.headline{font-size:clamp(56px,15vw,90px)}.eyebrow{font-size:10px;letter-spacing:.16em}footer{font-size:11px}}
    @media(prefers-reduced-motion:no-preference){.headline,.eyebrow,.desc{animation:rise .65s ease-out both}.headline{animation-delay:.08s}.desc{animation-delay:.16s}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}}
  </style>
</head>
<body>
<div class="shell">
  <header><div class="mark" aria-hidden="true">N</div><div class="brand">Nostalgic Store</div></header>
  <main>
    <p class="eyebrow">Algo especial está chegando</p>
    <h1 class="headline">Em breve,<br><em>novidades.</em></h1>
    <p class="desc">Estamos preparando nosso novo espaço online. Em breve, você encontrará tudo por aqui.</p>
    <div class="line" aria-hidden="true"></div>
  </main>
  <footer><span>© <span id="year">2026</span> Nostalgic Store</span><span>nostalgicstore.com.br</span></footer>
</div>
<script>document.getElementById('year').textContent=new Date().getFullYear()</script>
</body>
</html>
